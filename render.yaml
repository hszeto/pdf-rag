# Render Blueprint. Deploy with: New → Blueprint, pointed at this repository.
#
# One web service runs both Puma and Sidekiq (see bin/render-start for why),
# plus a Key Value instance for the cache, Action Cable and the Sidekiq queue.
#
# Postgres is NOT created here. It references `general-postgres-db`, which must
# already exist in the workspace — a blueprint may point at a database it does
# not define, and Render allows only one free Postgres per workspace anyway.

services:
  - type: web
    name: pdf-rag
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    # Overrides the Dockerfile's CMD, which starts the web server alone.
    dockerCommand: ./bin/render-start
    envVars:
      # Decrypts config/credentials.yml.enc, which holds gemini_api_key.
      # sync: false means Render prompts for it instead of storing it here.
      - key: RAILS_MASTER_KEY
        sync: false
      # The shared Postgres, not one this blueprint creates. Every table this
      # app owns lands in the `pdfrag` schema (schema_search_path in
      # database.yml, which a URL without one does not override), so it can sit
      # beside other applications in the same database without collision.
      - key: DATABASE_URL
        fromDatabase:
          name: general-postgres-db
          property: connectionString
      # Cache and Action Cable use this URL as given; only the Sidekiq
      # initializer rewrites the database number, to /2.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pdf-rag-kv
          property: connectionString
      - key: RAILS_ENV
        value: production
      # 512 MB has to hold Puma and Sidekiq together, so both stay small.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SIDEKIQ_CONCURRENCY
        value: "2"

  - type: keyvalue
    name: pdf-rag-kv
    plan: free
    region: oregon
    # Internal connections only — nothing outside Render reaches it.
    ipAllowList: []

  # Retention sweep. Cron jobs are not available on the free tier, so this is
  # commented out; correctness does not depend on it, because Document.live
  # scopes every read to expires_at and an expired document is unreachable
  # whether or not anything has deleted it. Uncomment on a paid plan to free
  # the bytes on schedule.
  #
  # - type: cron
  #   name: pdf-rag-retention-sweep
  #   runtime: docker
  #   plan: starter
  #   region: oregon
  #   schedule: "*/15 * * * *"
  #   dockerCommand: ./bin/rails retention:sweep
